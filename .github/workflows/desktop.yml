name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop
      - run: npm run desktop:build
      - run: node desktop/verify.cjs
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: github-monitor-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
